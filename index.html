<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2efe9">
<title>洪流之下的名字 —— 2026年中尼边境吉隆口岸泥石流数据纪事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--paper:#f2efe9;--ink:#171715;--muted:#716e67;--red:#a33b2b;--line:rgba(23,23,21,.2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;-webkit-font-smoothing:antialiased}
.cover{min-height:100svh;display:grid;grid-template-columns:minmax(420px,44%) 1fr;position:relative;overflow:hidden}
.copy{display:flex;flex-direction:column;padding:34px clamp(34px,4.5vw,76px) 30px;position:relative;z-index:2}
.topline,.meta,.credit,.enter,.date-en{font-family:"Noto Sans SC",sans-serif}
.topline{display:flex;justify-content:space-between;gap:20px;padding-bottom:15px;border-bottom:1px solid var(--ink);font-size:10px;letter-spacing:.22em}
.topline span:last-child{color:var(--red)}
.title-block{margin:auto 0;padding:7vh 0 5vh}
.date-en{display:flex;align-items:center;gap:12px;color:var(--red);font-size:12px;font-weight:700;letter-spacing:.18em}
.date-en:before{content:"";width:36px;height:2px;background:var(--red)}
h1{margin-top:25px;font-size:clamp(52px,6.3vw,102px);font-weight:900;line-height:1.12;letter-spacing:-.055em}
h1 span{display:block}
.deck{max-width:400px;margin-top:30px;padding-left:18px;border-left:1px solid var(--red);font-size:15px;line-height:2;color:#4e4b45}
.subtitle{margin-top:20px;color:var(--muted);font-family:"Noto Sans SC",sans-serif;font-size:12px;letter-spacing:.06em;line-height:1.9}
.enter{display:inline-flex;align-items:center;gap:26px;width:max-content;margin-top:36px;padding:13px 0;color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.16em;text-decoration:none;border-bottom:2px solid var(--ink);transition:color .2s,border-color .2s}
.enter:after{content:"→";font-size:22px;font-weight:400;transition:transform .2s}
.enter:hover{color:var(--red);border-color:var(--red)}.enter:hover:after{transform:translateX(6px)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:16px;border-top:1px solid var(--line);font-size:10px;line-height:1.8;letter-spacing:.12em;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-size:11px;font-weight:500}
.photo{position:relative;min-height:100svh;background:#343b3a;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:53% center;filter:saturate(.58) contrast(1.08) brightness(.78)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,23,21,.2),transparent 35%),linear-gradient(0deg,rgba(10,15,15,.65),transparent 42%);pointer-events:none}
.photo-caption{position:absolute;z-index:2;left:34px;right:34px;bottom:30px;display:flex;justify-content:space-between;gap:20px;color:rgba(255,255,255,.78);font:10px/1.8 "Noto Sans SC",sans-serif;letter-spacing:.1em}
.photo-caption span:last-child{text-align:right}
.place{position:absolute;z-index:2;right:30px;top:32px;color:#fff;font:10px "Noto Sans SC",sans-serif;letter-spacing:.22em;writing-mode:vertical-rl}
.credit{margin-top:14px;color:var(--muted);font-size:10px;letter-spacing:.12em}
.visits{margin-top:6px;color:var(--muted);font-size:10px;letter-spacing:.12em;
  font-family:"Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}
.visits b{font-weight:400;color:var(--ink);display:inline-block;min-width:1.6em;
  font-variant-numeric:tabular-nums;transition:color .3s}
.visits.counting b{color:var(--red)}
.visits[hidden]{display:none}
@media(max-width:800px){
.cover{display:block}.copy{min-height:72svh;padding:24px 24px 28px}.title-block{padding:9vh 0 6vh}h1{font-size:clamp(48px,14vw,72px)}
.deck{font-size:14px;margin-top:24px}.photo{min-height:52svh}.photo-caption{left:20px;right:20px;bottom:18px}.place{right:20px;top:20px}
}
@media(prefers-reduced-motion:no-preference){.photo img{animation:reveal 1.4s ease both}.title-block{animation:rise .9s ease both}@keyframes reveal{from{opacity:0;transform:scale(1.025)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="cover">
  <section class="copy" aria-labelledby="title">
    <div class="topline"><span>DATA NEWS</span><span>2026</span></div>
    <div class="title-block">
      <div class="date-en">26 AUGUST · GYIRONG</div>
      <h1 id="title"><span>洪流之下的</span><span>名字</span></h1>
      <p class="subtitle">2026 年中尼边境吉隆口岸泥石流数据纪事</p>
      <p class="deck">2026 年 8 月 26 日，泥石流穿过吉隆口岸。沿着当天的清晨、山谷与救援登记，我们重新走进那些名字。</p>
      <a class="enter" href="ch2/index.html">进入数据纪事</a>
    </div>
    <div>
      <div class="meta"><span><b>中国 · 吉隆口岸</b>28.28° N，85.38° E</span><span><b>尼泊尔 · 热索瓦</b>一场跨越国境的灾难</span></div>
      <div class="credit">文字与可视化 · Yadnus、Angel</div>
      <div class="visits" id="visits" aria-live="polite" hidden>浏览人数：<b id="visitCount">—</b></div>
    </div>
  </section>
  <figure class="photo">
    <img src="ch2/assets/ref_photos/nepal_china_border_4k.jpg" alt="群山环绕的吉隆口岸与友谊桥">
    <span class="place">GYIRONG · NEPAL / CHINA</span>
    <figcaption class="photo-caption"><span>01 / 河谷与口岸</span><span>向下阅读<br>约 12 分钟</span></figcaption>
  </figure>
</main>
<script>
(function(){
  "use strict";
  var URL="https://abacus.jasoncameron.dev/hit/gyirong-2026/visits";
  var box=document.getElementById("visits"),num=document.getElementById("visitCount");
  if(!box||!num)return;

  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var started=false;

  function fmt(n){return Math.round(n).toLocaleString("en-US");}

  /* 从 0 滚动到目标值：先快后慢，末尾缓出 */
  function countUp(target){
    var to=Math.max(0,Math.round(Number(target)||0));
    if(!to)return;

    if(reduce){num.textContent=fmt(to);box.hidden=false;return;}

    box.hidden=false;
    box.classList.add("counting");
    var dur=Math.min(2000,700+to*2.2);     /* 数字越大滚得稍久，但有上限 */
    var t0=performance.now();
    num.textContent="0";

    (function step(now){
      var p=Math.min(1,(now-t0)/dur);
      var e=1-Math.pow(1-p,3);             /* easeOutCubic */
      num.textContent=fmt(to*e);
      if(p<1)requestAnimationFrame(step);
      else{num.textContent=fmt(to);box.classList.remove("counting");}  /* 收尾对齐真实值 */
    })(t0);
  }

  function show(v){
    if(started)return;
    started=true;
    countUp(v);
  }

  if(window.fetch){
    var ctl=window.AbortController?new AbortController():null;
    var timer=ctl?setTimeout(function(){ctl.abort();},6000):null;
    fetch(URL,ctl?{signal:ctl.signal,cache:"no-store"}:{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        if(timer)clearTimeout(timer);
        if(d&&typeof d.value!=="undefined")show(d.value);
      })
      .catch(function(){ if(timer)clearTimeout(timer); });
  }
})();
</script>
</body>
</html>
