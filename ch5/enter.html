<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在念出名字之前 — 吉隆口岸泥石流数据纪事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&amp;family=Noto+Sans+SC:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--void:#0d0f0e;--paper:#efeade;--dim:#8e8a80;--faint:#5c5952;--warm:#c08569;
  --serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased;
  cursor:default}
#embers{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 62% 58% at 50% 46%,transparent 30%,rgba(0,0,0,.55) 100%)}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 8%;
  pointer-events:none}
.kicker{font-family:var(--sans);font-size:11px;letter-spacing:.52em;color:var(--faint);
  opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease}
.kicker.on{opacity:1;transform:none}
.rule{width:1px;height:52px;background:linear-gradient(to bottom,transparent,rgba(192,133,105,.5),transparent);
  margin:34px 0;opacity:0;transition:opacity 1.8s ease .2s}
.rule.on{opacity:1}
.l1{margin-top:6px;font-size:clamp(19px,2.1vw,27px);line-height:2.1;font-weight:400;
  letter-spacing:.06em;color:#bdb7a9;opacity:0;transform:translateY(12px);
  transition:opacity 1.8s ease,transform 1.8s ease}
.l1.on{opacity:1;transform:none}
.l2{margin-top:26px;font-size:clamp(26px,3.4vw,46px);line-height:1.85;font-weight:600;
  letter-spacing:.04em;color:var(--paper);opacity:0;transform:translateY(14px);
  transition:opacity 2.2s ease,transform 2.2s ease}
.l2.on{opacity:1;transform:none}
.l2 em{font-style:normal;color:var(--warm)}

/* 静默计时 */
.silence{margin-top:64px;width:min(300px,64vw);opacity:0;transition:opacity 1.4s ease}
.silence.on{opacity:1}
.silence .cap{font-family:var(--sans);font-size:10px;letter-spacing:.42em;
  color:var(--faint);margin-bottom:14px}
.silence .track{position:relative;height:1px;background:rgba(239,234,222,.13)}
.silence .fill{position:absolute;left:0;top:0;height:100%;width:0;
  background:linear-gradient(90deg,rgba(192,133,105,.25),rgba(192,133,105,.95));
  transition:width 3s linear}
.silence.done .cap{color:var(--warm)}

/* 进入 */
.gate{margin-top:46px;opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity 1.6s ease,transform 1.6s ease}
.gate.on{opacity:1;transform:none;pointer-events:auto}
.gate a{display:inline-flex;align-items:center;gap:20px;color:var(--paper);
  font-family:var(--sans);font-size:12.5px;letter-spacing:.34em;text-decoration:none;
  padding:14px 4px;border-bottom:1px solid rgba(239,234,222,.32);
  transition:color .3s,border-color .3s,gap .3s}
.gate a:hover{color:var(--warm);border-color:var(--warm);gap:28px}
.gate a:after{content:"→";font-size:17px;letter-spacing:0;transition:transform .3s}
.gate a:hover:after{transform:translateX(3px)}

/* 跳过 */
.skip{position:fixed;right:clamp(18px,3vw,44px);bottom:clamp(16px,3vh,34px);
  font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--faint);
  text-decoration:none;opacity:0;transition:opacity 1.2s ease,color .3s;z-index:5}
.skip.on{opacity:.55}
.skip:hover{color:var(--dim);opacity:1}

.back{position:fixed;left:clamp(18px,3vw,44px);top:clamp(16px,3vh,30px);z-index:5;
  font-family:var(--sans);font-size:10px;letter-spacing:.24em;color:var(--faint);
  text-decoration:none;opacity:0;transition:opacity 1.2s ease,color .3s}
.back.on{opacity:.45}
.back:hover{color:var(--dim);opacity:1}

@media (max-width:700px){
  .kicker{font-size:10px;letter-spacing:.36em}
  .rule{height:38px;margin:24px 0}
  .l1{font-size:16px;line-height:2}
  .l2{font-size:23px;line-height:1.9;margin-top:18px}
  .silence{margin-top:44px}
  .gate{margin-top:34px}
  .gate a{font-size:11.5px;letter-spacing:.24em;gap:14px}
}
@media (prefers-reduced-motion:reduce){
  .kicker,.l1,.l2,.rule,.silence,.gate,.skip,.back{transition:none!important}
}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<a class="back" id="back" href="../ch4/index.html">← 返回</a>

<main class="stage">
  <div class="kicker" id="kicker">在 念 出 名 字 之 前</div>
  <div class="rule" id="rule"></div>
  <p class="l1" id="l1">我们已经知道，<br>这里有多少人。</p>
  <p class="l2" id="l2">现在，<br>我们来念他们的<em>名字</em>。</p>

  <div class="silence" id="silence">
    <div class="cap" id="silCap">静 默 三 秒</div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <div class="gate" id="gate">
    <a href="index.html" id="enter">进 入 纪 念 墙</a>
  </div>
</main>

<a class="skip" id="skip" href="index.html">跳 过 →</a>

<script>
(function(){
  "use strict";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $=id=>document.getElementById(id);
  const kicker=$("kicker"),rule=$("rule"),l1=$("l1"),l2=$("l2"),
        silence=$("silence"),fill=$("fill"),silCap=$("silCap"),gate=$("gate"),
        skip=$("skip"),back=$("back");

  /* ---------- 缓慢上浮的名字，像远处的灯 ---------- */
  const cv=$("embers"),ctx=cv.getContext("2d");
  let W=0,H=0,dpr=1,motes=[],names=[],raf=0;

  function resize(){
    dpr=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    cv.style.width=W+"px";cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function seed(){
    motes=[];
    const n=reduce?0:(W<700?10:16);
    for(let i=0;i<n;i++)motes.push(spawn(true));
  }
  function spawn(initial){
    return {
      x:Math.random()*W,
      y:initial?Math.random()*H:H+20+Math.random()*60,
      vy:-(0.10+Math.random()*0.16),
      drift:(Math.random()-0.5)*0.10,
      r:0.9+Math.random()*1.5,
      life:0,
      max:900+Math.random()*900,
      name:names.length?names[(Math.random()*names.length)|0]:""
    };
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<motes.length;i++){
      const m=motes[i];
      m.y+=m.vy;m.x+=m.drift;m.life++;
      const fade=Math.min(1,m.life/240)*Math.max(0,1-m.life/m.max);
      const a=fade*0.16;
      if(a>0.004){
        ctx.beginPath();
        ctx.arc(m.x,m.y,m.r,0,6.2832);
        ctx.fillStyle=`rgba(239,234,222,${a.toFixed(3)})`;
        ctx.fill();
      }
      if(m.life>m.max||m.y<-30){
        motes[i]=spawn(false);
      }
    }
    raf=requestAnimationFrame(draw);
  }

  /* 取真实姓名做极淡的漂浮字，只在宽屏出现少量 */
  function loadNames(){
    fetch("assets/name_wall.json")
      .then(r=>r.ok?r.json():[])
      .then(d=>{
        names=(Array.isArray(d)?d:[]).map(p=>p&&p.name).filter(Boolean);
      })
      .catch(()=>{});
  }

  /* ---------- 时间线 ---------- */
  const seq=[
    [420, ()=>kicker.classList.add("on")],
    [1300,()=>rule.classList.add("on")],
    [1700,()=>l1.classList.add("on")],
    [3600,()=>l2.classList.add("on")],
    [4500,()=>{silence.classList.add("on");}],
    [5000,()=>{fill.style.width="100%";}],
    [8100,()=>{silence.classList.add("done");silCap.textContent="愿 每 一 个 名 字 都 被 看 见";}],
    [8700,()=>gate.classList.add("on")],
    [2100,()=>{skip.classList.add("on");back.classList.add("on");}]
  ];
  if(reduce){
    [kicker,rule,l1,l2,silence,gate,skip,back].forEach(el=>el.classList.add("on"));
    fill.style.width="100%";
    silCap.textContent="愿 每 一 个 名 字 都 被 看 见";
    silence.classList.add("done");
  }else{
    seq.forEach(([t,fn])=>setTimeout(fn,t));
  }

  /* 回车 / 空格 直接进入；全程可点跳过 */
  addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){location.href="index.html";}
  });

  /* ---------- 启动 ---------- */
  resize();seed();loadNames();
  if(!reduce){raf=requestAnimationFrame(draw);}
  addEventListener("resize",()=>{resize();seed();});
  addEventListener("visibilitychange",()=>{
    if(document.hidden){cancelAnimationFrame(raf);}
    else if(!reduce){raf=requestAnimationFrame(draw);}
  });
})();
</script>
</body>
</html>
